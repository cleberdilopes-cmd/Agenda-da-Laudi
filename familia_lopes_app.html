<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Família Lopes · Finanças</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3EE;--card:#fff;--ink:#1A1A2E;--ink2:#4A4A6A;--border:#E8E4DC;--accent:#2563EB;--green:#059669;--red:#DC2626;--orange:#EA580C;--yellow:#D97706;--purple:#7C3AED;--radius:14px;--shadow:0 2px 12px rgba(26,26,46,0.07);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;}
/* HEADER */
.hdr{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.hdr-title{font-size:19px;font-weight:800;letter-spacing:-0.3px;}
.hdr-title span{color:#7C9BF5;}
.hdr-sub{font-size:11px;color:rgba(255,255,255,0.4);margin-top:1px;}
.hdr-right{text-align:right;}
.badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-block;}
.save-info{font-size:10px;color:rgba(255,255,255,0.35);margin-top:3px;}
/* NAV */
.nav{background:#fff;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:58px;z-index:99;}
.nav::-webkit-scrollbar{display:none;}
.nav-tab{padding:12px 16px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;flex-shrink:0;}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
/* MAIN */
.main{padding:14px;max-width:960px;margin:0 auto;}
/* SECTIONS */
.sec{display:none;animation:fadeUp .25s ease;}
.sec.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* CARD */
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);}
.card-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--ink2);margin-bottom:6px;}
.card-val{font-size:22px;font-weight:800;line-height:1;}
.card-sub{font-size:11px;color:var(--ink2);margin-top:3px;}
/* GRID */
.g4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
@media(min-width:540px){.g4{grid-template-columns:repeat(4,1fr);}}
/* MES SELECTOR */
.mes-sel{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px;}
.mes-sel::-webkit-scrollbar{display:none;}
.mes-btn{padding:7px 14px;border-radius:99px;border:1.5px solid var(--border);background:#fff;color:var(--ink2);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;}
.mes-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
/* THERMO */
.thermo{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:14px;}
.thermo-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.thermo-pct{font-size:26px;font-weight:800;color:var(--accent);}
.thermo-bar-bg{height:10px;background:var(--border);border-radius:99px;overflow:hidden;}
.thermo-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));transition:width .5s;}
.thermo-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--ink2);margin-top:3px;}
/* CHART */
.chart-wrap{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:14px;}
.chart-title{font-weight:700;font-size:14px;margin-bottom:12px;}
.chart-bars{display:flex;align-items:flex-end;gap:5px;height:120px;}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:3px;}
.chart-col-bars{display:flex;gap:3px;align-items:flex-end;justify-content:center;width:100%;}
.bar{border-radius:3px 3px 0 0;min-height:3px;}
.bar-r{background:var(--accent);}
.bar-d{background:var(--red);opacity:.8;}
.chart-lbl{font-size:9px;color:var(--ink2);text-align:center;}
.legend{display:flex;gap:14px;margin-top:10px;justify-content:center;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);}
.legend-dot{width:10px;height:10px;border-radius:3px;}
/* GRUPOS */
.grupo-box{border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow);}
.grupo-hdr{padding:10px 14px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.8px;background:var(--ink);color:#fff;}
.conta-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border);transition:background .15s;background:#fff;}
.conta-row:last-child{border-bottom:none;}
.conta-row.Pago{background:#F0FDF4;}
.conta-row.Atrasado{background:#FEF2F2;}
.conta-row.Adiado{background:#FFF7ED;}
.conta-row.Cancelado{background:#F9FAFB;opacity:.6;}
.conta-nome{font-size:13px;font-weight:700;cursor:pointer;}
.conta-nome:hover{color:var(--accent);}
.conta-info{font-size:11px;color:var(--ink2);margin-top:2px;}
.conta-valor{font-size:13px;font-weight:700;text-align:right;white-space:nowrap;}
.dec-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px;margin-top:3px;}
.dec-PAGAR{background:#DBEAFE;color:#1D4ED8;}
.dec-ATRASAR{background:#FEE2E2;color:#B91C1C;}
.st-select{font-size:12px;padding:5px 7px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-weight:600;color:var(--ink);cursor:pointer;outline:none;font-family:inherit;}
/* RESUMO */
.resumo-card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:14px;}
.resumo-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.resumo-row:last-child{border-bottom:none;font-size:16px;font-weight:800;padding-top:12px;}
/* RECEITAS */
.rec-card{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:10px;}
.rec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.rec-nome{font-weight:700;font-size:14px;}
.rec-val{font-weight:800;font-size:18px;color:var(--green);}
.rec-input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);outline:none;transition:border-color .2s;background:var(--bg);}
.rec-input:focus{border-color:var(--accent);}
/* HOJE */
.hoje-hero{background:linear-gradient(135deg,var(--ink),var(--accent));border-radius:var(--radius);padding:18px;color:#fff;margin-bottom:14px;}
.hoje-titulo{font-size:17px;font-weight:800;margin-bottom:2px;}
.hoje-sub{font-size:11px;opacity:.7;}
.hoje-total{font-size:30px;font-weight:800;margin-top:10px;}
.vence-item{background:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;border:1px solid var(--border);box-shadow:var(--shadow);}
.vence-dia{width:44px;height:44px;border-radius:11px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex-shrink:0;}
.vence-dia.urgente{background:var(--red);}
.vence-info{flex:1;}
.vence-nome{font-weight:700;font-size:14px;}
.vence-grupo{font-size:11px;color:var(--ink2);margin-top:2px;}
.vence-right{text-align:right;}
.vence-val{font-weight:800;font-size:17px;}
/* ALÍVIO */
.alivio-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.alivio-item:last-child{border-bottom:none;}
.alivio-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.alivio-info{flex:1;}
.alivio-date{font-size:12px;font-weight:700;}
.alivio-desc{font-size:13px;margin-top:1px;}
.alivio-acum{font-size:11px;color:var(--ink2);margin-top:2px;}
.alivio-val{font-weight:800;font-size:16px;color:var(--green);}
/* ROSCA */
.rosca-wrap{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:14px;}
.rosca-container{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.rosca-legend-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;}
.rosca-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
/* MODAL */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(26,26,46,.6);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-ov.open{display:flex;}
.modal-box{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(26,26,46,.2);}
.modal-title{font-size:19px;font-weight:800;margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;}
.field input,.field select{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);font-family:inherit;font-size:14px;color:var(--ink);outline:none;background:#fff;}
.field input:focus,.field select:focus{border-color:var(--accent);}
.modal-btns{display:flex;gap:10px;margin-top:16px;}
.btn{flex:1;padding:12px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;border:none;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--bg);color:var(--ink2);}
/* UTILS */
.empty{text-align:center;padding:40px 20px;color:var(--ink2);}
.empty-icon{font-size:36px;margin-bottom:8px;}
.green{color:var(--green);}
.red{color:var(--red);}
.blue{color:var(--accent);}
.orange{color:var(--orange);}
</style>
</head>

      receitas = d.receitas || JSON.parse(JSON.stringify(REC_ORIG));
      statusData = d.status || {};
    } else {
      contas = JSON.parse(JSON.stringify(CONTAS_ORIG));
      receitas = JSON.parse(JSON.stringify(REC_ORIG));
      statusData = {};
    }
  } catch(e){
    contas = JSON.parse(JSON.stringify(CONTAS_ORIG));
    receitas = JSON.parse(JSON.stringify(REC_ORIG));
    statusData = {};
  }
}

function saveState(){
  try{
    localStorage.setItem(SK, JSON.stringify({contas,receitas,status:statusData}));
    const ts = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('saveInfo').textContent = '✓ Salvo às '+ts;
  } catch(e){}
}

// ============================================================
// HELPERS
// ============================================================
function fmt(v){return 'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtS(v){return (v<0?'-':'')+fmt(v);}
function mesLabel(cod){const i=MESES_COD.indexOf(cod);return i>=0?MESES[i]:'';}
function getContasMes(mes){return contas.map((c,i)=>({...c,idx:i})).filter(c=>c.mes_ini<=mes&&c.mes_fim>=mes);}
function getSt(mes,idx){return (statusData[mes]||{})[idx]||'Pendente';}
function getReceita(mes){return Object.values(receitas[mes]||{}).reduce((a,b)=>a+Number(b),0);}
function getDesp(mes){return getContasMes(mes).filter(c=>c.decisao!=='ATRASAR'&&getSt(mes,c.idx)!=='Cancelado').reduce((a,c)=>a+c.valor,0);}
function getAdiado(mes){return getContasMes(mes).filter(c=>c.decisao==='ATRASAR'&&getSt(mes,c.idx)!=='Cancelado').reduce((a,c)=>a+c.valor,0);}
function getPago(mes){return getContasMes(mes).filter(c=>getSt(mes,c.idx)==='Pago').reduce((a,c)=>a+c.valor,0);}
function getPendente(mes){return getContasMes(mes).filter(c=>getSt(mes,c.idx)==='Pendente'&&c.decisao!=='ATRASAR').reduce((a,c)=>a+c.valor,0);}
function getSaldo(mes){return getReceita(mes)-getDesp(mes);}

function updateStatus(mes,idx,val){
  if(!statusData[mes])statusData[mes]={};
  statusData[mes][idx]=val;
  saveState();
  renderCurrentTab();
}

function updateReceita(mes,key,val){
  if(!receitas[mes])receitas[mes]={};
  receitas[mes][key]=parseFloat(val)||0;
  saveState();
  document.getElementById('recTotal').textContent=fmt(getReceita(mes));
  document.getElementById('recVal-'+key).textContent=fmt(receitas[mes][key]);
}

// ============================================================
// RENDER HELPERS
// ============================================================
function mesSel(cur, fn, id){
  return `<div class="mes-sel" id="${id}">${MESES.map((m,i)=>`<button class="mes-btn${MESES_COD[i]===cur?' active':''}" onclick="${fn}(${MESES_COD[i]})">${m}</button>`).join('')}</div>`;
}

function roscaSVG(mes){
  const cm=getContasMes(mes).filter(c=>getSt(mes,c.idx)!=='Cancelado');
  const cats={};cm.forEach(c=>{cats[c.cat]=(cats[c.cat]||0)+c.valor;});
  const total=Object.values(cats).reduce((a,b)=>a+b,0)||1;
  const R=60,r=38,cx=70,cy=70;
  let acc=0,paths='';
  function polar(pct,rad){return[cx+Math.cos((pct*2*Math.PI-Math.PI/2))*rad,cy+Math.sin((pct*2*Math.PI-Math.PI/2))*rad];}
  Object.entries(cats).forEach(([cat,val])=>{
    const pct=val/total;
    const [x1,y1]=polar(acc,R);const [x2,y2]=polar(acc+pct,R);
    const [ix1,iy1]=polar(acc,r);const [ix2,iy2]=polar(acc+pct,r);
    const lg=pct>.5?1:0;
    paths+=`<path d="M${x1},${y1} A${R},${R} 0 ${lg},1 ${x2},${y2} L${ix2},${iy2} A${r},${r} 0 ${lg},0 ${ix1},${iy1} Z" fill="${CAT_CORES[cat]||'#94A3B8'}"/>`;
    acc+=pct;
  });
  const leg=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="rosca-legend-item"><div class="rosca-dot" style="background:${CAT_CORES[c]||'#94A3B8'}"></div><span style="flex:1;color:var(--ink2)">${c}</span><span style="font-weight:700">${fmt(v)}</span></div>`).join('');
  return `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <svg width="140" height="140" viewBox="0 0 140 140">${paths}
      <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="9" fill="var(--ink2)">Total</text>
      <text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--ink)" font-family="Outfit,sans-serif">${fmt(total).replace('R$ ','R$')}</text>
    </svg>
    <div style="flex:1;min-width:140px">${leg}</div>
  </div>`;
}

function barChart(data,height){
  const max=Math.max(...data.map(d=>Math.max(d.r,d.d)),1);
  return data.map((d,i)=>{
    const rh=Math.max(Math.round(d.r/max*(height-20)),3);
    const dh=Math.max(Math.round(d.d/max*(height-20)),3);
    return `<div class="chart-col"><div class="chart-col-bars"><div class="bar bar-r" style="width:14px;height:${rh}px"></div><div class="bar bar-d" style="width:14px;height:${dh}px"></div></div><div class="chart-lbl">${d.lbl}</div></div>`;
  }).join('');
}

function saldoChart(){
  const saldos=MESES_COD.map(m=>getSaldo(m));
  const minS=Math.min(...saldos),maxS=Math.max(...saldos),range=maxS-minS||1;
  return saldos.map((s,i)=>{
    const h=Math.max(Math.round((s-minS)/range*80)+8,4);
    return `<div class="chart-col"><div style="height:100px;display:flex;align-items:flex-end"><div style="width:20px;height:${h}px;background:${s>=0?'var(--green)':'var(--red)'};border-radius:4px 4px 0 0;opacity:.85"></div></div><div class="chart-lbl">${MESES[i].split('/')[0]}</div></div>`;
  }).join('');
}

// ============================================================
// SECTIONS
// ============================================================
function renderDashboard(){
  const m=curMes;
  const rec=getReceita(m),desp=getDesp(m),pago=getPago(m),saldo=getSaldo(m);
  const pct=rec>0?Math.min(Math.round(desp/rec*100),100):0;
  const chartData=MESES_COD.map((mc,i)=>({lbl:MESES[i].split('/')[0],r:getReceita(mc),d:getDesp(mc)}));
  document.getElementById('hdrMes').textContent=mesLabel(m);
  document.getElementById('sec-dashboard').innerHTML=`
    <div class="g4">
      <div class="card"><div class="card-label">Receita</div><div class="card-val blue">${fmt(rec)}</div><div class="card-sub">${mesLabel(m)}</div></div>
      <div class="card"><div class="card-label">Despesas</div><div class="card-val red">${fmt(desp)}</div><div class="card-sub">a pagar</div></div>
      <div class="card"><div class="card-label">Pago</div><div class="card-val green">${fmt(pago)}</div><div class="card-sub">confirmado</div></div>
      <div class="card"><div class="card-label">Saldo</div><div class="card-val ${saldo>=0?'green':'red'}">${fmtS(saldo)}</div><div class="card-sub">${saldo>=0?'positivo':'negativo'}</div></div>
    </div>
    <div class="thermo">
      <div class="thermo-hdr">
        <div><div style="font-weight:700;font-size:14px">Orçamento — ${mesLabel(m)}</div><div style="font-size:11px;color:var(--ink2);margin-top:2px">Despesas ÷ Receita</div></div>
        <div class="thermo-pct">${pct}%</div>
      </div>
      <div class="thermo-bar-bg"><div class="thermo-bar" style="width:${pct}%"></div></div>
      <div class="thermo-lbl"><span>0%</span><span>50%</span><span>100%</span></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">Receita × Despesa por Mês</div>
      <div class="chart-bars" style="height:120px">${barChart(chartData,120)}</div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>Receita</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--red);opacity:.8"></div>Despesa</div>
      </div>
    </div>
    <div class="rosca-wrap">
      <div class="chart-title">Categorias — ${mesLabel(m)}</div>
      ${roscaSVG(m)}
    </div>`;
}

function renderHoje(){
  const dia=new Date().getDate(),m=curMes;
  const vence=getContasMes(m).filter(c=>c.dia>=dia&&c.dia<=dia+7&&getSt(m,c.idx)!=='Pago'&&getSt(m,c.idx)!=='Cancelado').sort((a,b)=>a.dia-b.dia);
  const total=vence.reduce((a,c)=>a+c.valor,0);
  const list=vence.length===0?`<div class="empty"><div class="empty-icon">✅</div>Nenhuma conta vencendo em breve!</div>`:
    vence.map(c=>`<div class="vence-item">
      <div class="vence-dia ${c.dia-dia<=2?'urgente':''}">${c.dia}</div>
      <div class="vence-info"><div class="vence-nome">${c.nome}</div><div class="vence-grupo">${c.grupo}</div></div>
      <div class="vence-right"><div class="vence-val">${fmt(c.valor)}</div><div><span class="dec-badge dec-${c.decisao}">${c.decisao}</span></div></div>
    </div>`).join('');
  document.getElementById('sec-hoje').innerHTML=`
    <div class="hoje-hero">
      <div class="hoje-titulo">Vence em breve</div>
      <div class="hoje-sub">Dia ${dia} · próximos 7 dias · ${mesLabel(m)}</div>
      <div class="hoje-total">${fmt(total)}</div>
    </div>${list}`;
}

function renderMes(mes){
  curMes=mes;
  const cm=getContasMes(mes);
  const grupos=[...new Set(cm.map(c=>c.grupo))];
  const rec=getReceita(mes),desp=getDesp(mes),ad=getAdiado(mes),pg=getPago(mes),pd=getPendente(mes),sl=getSaldo(mes);
  let html=mesSel(mes,'renderMes','ms1');
  grupos.forEach(g=>{
    const gc=cm.filter(c=>c.grupo===g);
    html+=`<div class="grupo-box"><div class="grupo-hdr">${g}</div>`;
    gc.forEach(c=>{
      const st=getSt(mes,c.idx);
      html+=`<div class="conta-row ${st}">
        <div>
          <div class="conta-nome" onclick="openEdit(${c.idx})">${c.nome} <span style="font-size:10px;color:var(--ink2)">✏️</span></div>
          <div class="conta-info">${c.cat} · dia ${c.dia}</div>
          <span class="dec-badge dec-${c.decisao}">${c.decisao}</span>
        </div>
        <div class="conta-valor">${fmt(c.valor)}</div>
        <select class="st-select" onchange="updateStatus(${mes},${c.idx},this.value)">
          ${['Pendente','Pago','Atrasado','Adiado','Cancelado'].map(s=>`<option${st===s?' selected':''}>${s}</option>`).join('')}
        </select>
      </div>`;
    });
    html+='</div>';
  });
  html+=`<div class="resumo-card">
    ${[['Receitas',fmt(rec),'blue'],['Despesas a pagar',fmt(desp),'red'],['Total Adiado',fmt(ad),'orange'],['Total Pago',fmt(pg),'green'],['Total Pendente',fmt(pd),'']].map(([l,v,c])=>`<div class="resumo-row"><span>${l}</span><span class="${c}">${v}</span></div>`).join('')}
    <div class="resumo-row"><span>SALDO DO MÊS</span><span class="${sl>=0?'green':'red'}">${fmtS(sl)}</span></div>
  </div>`;
  document.getElementById('sec-meses').innerHTML=html;
  document.getElementById('hdrMes').textContent=mesLabel(mes);
}

function renderReceitas(mes){
  recMes=mes;
  const r=receitas[mes]||{};
  const total=Object.values(r).reduce((a,b)=>a+Number(b),0);
  let html=mesSel(mes,'renderReceitas','ms2');
  html+=`<div class="card" style="background:linear-gradient(135deg,var(--ink),var(--accent));color:white;margin-bottom:12px">
    <div style="font-size:12px;opacity:.8">Total ${mesLabel(mes)}</div>
    <div id="recTotal" style="font-size:26px;font-weight:800;margin-top:4px">${fmt(total)}</div>
  </div>`;
  Object.entries(r).forEach(([k,v])=>{
    html+=`<div class="rec-card">
      <div class="rec-hdr">
        <div class="rec-nome">${REC_LABELS[k]}</div>
        <div class="rec-val" id="recVal-${k}">${fmt(Number(v))}</div>
      </div>
      <input class="rec-input" type="number" step="0.01" value="${v}" onchange="updateReceita(${mes},'${k}',this.value)">
    </div>`;
  });
  document.getElementById('sec-receitas').innerHTML=html;
}

function renderAlivio(){
  let acum=0;
  const list=ALIVIO_EVENTOS.map(e=>{
    acum+=e.eco;
    return `<div class="alivio-item">
      <div class="alivio-dot" style="background:${e.cor}"></div>
      <div class="alivio-info">
        <div class="alivio-date" style="color:${e.cor}">${e.data}</div>
        <div class="alivio-desc">${e.desc}</div>
        <div class="alivio-acum">Acumulado: ${fmt(acum)}/mês</div>
      </div>
      <div class="alivio-val">+${fmt(e.eco)}</div>
    </div>`;
  }).join('');
  document.getElementById('sec-alivio').innerHTML=`
    <div class="card" style="margin-bottom:14px">
      <div style="font-weight:700;font-size:16px;margin-bottom:14px">Próximas vitórias 🏆</div>
      ${list}
    </div>
    <div class="chart-wrap">
      <div class="chart-title">Saldo Projetado por Mês</div>
      <div class="chart-bars" style="height:100px">${saldoChart()}</div>
    </div>`;
}

// ============================================================
// MODAL
// ============================================================
function openEdit(idx){
  editIdx=idx;
  const c=contas[idx];
  document.getElementById('eNome').value=c.nome;
  document.getElementById('eValor').value=c.valor;
  document.getElementById('eDecisao').value=c.decisao;
  document.getElementById('modalOv').classList.add('open');
}

function closeModal(){
  document.getElementById('modalOv').classList.remove('open');
  editIdx=null;
}

function saveEdit(){
  if(editIdx===null)return;
  contas[editIdx].nome=document.getElementById('eNome').value;
  contas[editIdx].valor=parseFloat(document.getElementById('eValor').value)||0;
  contas[editIdx].decisao=document.getElementById('eDecisao').value;
  saveState();
  closeModal();
  renderCurrentTab();
}

document.getElementById('modalOv').addEventListener('click',function(e){if(e.target===this)closeModal();});

// ============================================================
// TABS
// ============================================================
let currentTab='dashboard';
function goTab(id,el){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  el.classList.add('active');
  currentTab=id;
  renderCurrentTab();
}

function renderCurrentTab(){
  if(currentTab==='dashboard')renderDashboard();
  else if(currentTab==='hoje')renderHoje();
  else if(currentTab==='meses')renderMes(curMes);
  else if(currentTab==='receitas')renderReceitas(recMes);
  else if(currentTab==='alivio')renderAlivio();
}

// ============================================================
// INIT
// ============================================================
loadState();
renderDashboard();
</script>

</html>
